version: 1
frontend:
  phases:
    preBuild:
      commands:
        # A imagem padrão do Amplify vem com Node 22.18; dependências do Astro 7 pedem >= 22.19
        - nvm install 24
        - nvm use 24
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
